[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtcsdd-research"
version = "0.1.0"
description = "Reproducible research infrastructure for RTC-SDD challenge"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "soundfile>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
training = ["torch>=2.3,<3", "scikit-learn>=1.3,<2", "tensorboard>=2.15,<3"]

[project.scripts]
rtcsdd = "rtcsdd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
