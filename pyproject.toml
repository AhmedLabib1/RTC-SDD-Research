
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtcsdd-research"
version = "0.2.0"
description = "Reproducible XLS-R + AASIST research framework for the RTC-SDD speech deepfake detection challenge"
requires-python = ">=3.10,<3.11"

dependencies = [
    "numpy>=1.24,<2",
    "soundfile>=0.12,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
training = [
    "torch==2.5.1",
    "huggingface-hub>=0.30,<1.0",
]

dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
rtcsdd = "rtcsdd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
